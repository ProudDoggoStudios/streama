# Sandbox-only reverse proxy for the Base44 preview (host port 3000 -> Streama on 8080).
#
# Two things make the app unusable straight behind the https preview proxy:
#  1. Grails/Spring Security builds *absolute* redirects from the request scheme,
#     and the preview proxy does not forward X-Forwarded-Proto, so secured URLs
#     answered `Location: http://<host>/login/auth`. Browsers block that http
#     navigation inside the https preview frame, leaving it blank.
#  2. The preview frame's entry document must be a real page. An anonymous GET /
#     is a 302 with an empty body, so the frame has nothing to render.
# Passing X-Forwarded-Proto fixes (1) for every redirect (login, logout, login
# target); serving the login page at "/" instead of the redirect fixes (2).
# Signed-in visitors still get the app shell (200) and are proxied untouched.
#
# Note: nginx does NOT inherit proxy_set_header into a location that defines its
# own, so the forwarded headers are repeated in every location block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = / {
        proxy_pass http://streama:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_intercept_errors on;
        error_page 302 =200 /_login;
    }

    # Internal: render the public login page (a 200) at "/" for anonymous visitors.
    location = /_login {
        internal;
        proxy_pass http://streama:8080/login/auth;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    location / {
        proxy_pass http://streama:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 0;
    }
}
