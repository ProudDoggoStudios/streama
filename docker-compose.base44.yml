# Base44 sandbox stack for Streama.
#
# Runs the app straight from the cloned source (`gradlew bootRun`, Grails 3 dev
# mode) instead of the prebuilt release jar used by docker/Dockerfile.
# The `docker` Grails environment is the project's own H2-file-database profile, so
# no external database service is required; the database and the default upload
# directory both live in the `streama_data` volume (mounted at /data).
#
# `preview` is a sandbox-only nginx shim that owns host port 3000: the app builds
# absolute `http://` redirects (see .base44/nginx-preview.conf for details), which
# an https preview frame cannot follow. It adds no app behaviour of its own.
services:
  streama:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "exec ./gradlew --no-daemon -Dgrails.env=docker -Dlocal.config.location=app-config.yml -Dlocal.config.regex=CustomRegex.yml bootRun"]
    volumes:
      - .:/app
      - gradle_cache:/root/.gradle
      - streama_data:/data
    environment:
      - GRADLE_OPTS=-Xmx2g -Dorg.gradle.daemon=false
      - BASE44_PREVIEW_MODE
    healthcheck:
      # First boot compiles the whole Grails app, hence the long start period.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login/auth"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s

  preview:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      streama:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./.base44/nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      base44.project: streama
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gradle_cache:
  streama_data:
